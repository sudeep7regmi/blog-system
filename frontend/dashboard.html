<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="dashboard-container">

  <div class="topbar">
    <h1>Blog Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="blog-form">

    <h2>Create Blog</h2>

    <input id="title" placeholder="Enter blog title">
    <textarea id="content" placeholder="Write blog content"></textarea>

    <button onclick="createBlog()">Create Blog</button>

  </div>

  <div class="blogs" id="blogs"></div>

</div>

<div id="editModal" class="modal hidden">

  <div class="modal-content">

    <h2>Edit Blog</h2>

    <input id="editTitle" placeholder="Edit title">
    <textarea id="editContent" placeholder="Edit content"></textarea>

    <div class="modal-actions">
      <button onclick="updateBlog()">Update</button>
      <button onclick="closeModal()">Cancel</button>
    </div>

  </div>

</div>

<script>

let currentUserId = null;
let editId = null;

async function getMe() {
  try {
    const res = await fetch('http://127.0.0.1:4000/api/auth/me', {
      credentials: 'include'
    })

    const data = await res.json()

    console.log("ME RESPONSE:", data)

    currentUserId = data.userId || data.user?.id || null

    console.log("CURRENT USER ID:", currentUserId)

  } catch (err) {
    console.log("getMe error", err)
  }
}

async function getBlogs() {

  const res = await fetch('http://127.0.0.1:4000/api/blogs')
  const blogs = await res.json()

  const container = document.getElementById('blogs')
  container.innerHTML = ''

  console.log("BLOG SAMPLE:", blogs[0])

  blogs.forEach(blog => {

    const isOwner =
      Number(blog.userId) === Number(currentUserId)

    container.innerHTML += `
      <div class="blog-card">

        <h3>${blog.title}</h3>
        <p>${blog.content}</p>

        ${isOwner ? `
          <button onclick='openEdit(${blog.id}, ${JSON.stringify(blog.title)}, ${JSON.stringify(blog.content)})'>
            Edit
          </button>

          <button onclick="deleteBlog(${blog.id})">
            Delete
          </button>
        ` : ''}

      </div>
    `
  })
}

async function createBlog() {

  const title = document.getElementById('title').value
  const content = document.getElementById('content').value

  const res = await fetch('http://127.0.0.1:4000/api/blogs', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ title, content })
  })

  if (res.ok) {
    document.getElementById('title').value = ''
    document.getElementById('content').value = ''
    getBlogs()
  } else {
    alert("Failed to create blog")
  }
}

async function deleteBlog(id) {

  await fetch(`http://127.0.0.1:4000/api/blogs/${id}`, {
    method: 'DELETE',
    credentials: 'include'
  })

  getBlogs()
}

function openEdit(id, title, content) {

  editId = id

  document.getElementById('editTitle').value = title
  document.getElementById('editContent').value = content

  document.getElementById('editModal').classList.remove('hidden')
}

function closeModal() {
  document.getElementById('editModal').classList.add('hidden')
}

async function updateBlog() {

  const title = document.getElementById('editTitle').value
  const content = document.getElementById('editContent').value

  await fetch(`http://127.0.0.1:4000/api/blogs/${editId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ title, content })
  })

  closeModal()
  getBlogs()
}

async function logout() {

  await fetch('http://127.0.0.1:4000/api/auth/logout', {
    method: 'POST',
    credentials: 'include'
  })

  window.location.href = './login.html'
}

async function init() {
  await getMe()
  await getBlogs()
}

init()

</script>

</body>
</html>
